<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Form: Student registration</h2>

    <form>
        <div>
            <label>House color:</label>
            <input type="color">
        </div>
        <div>
            <label>Full name:</label>
            <input type="text" placeholder="e.g; John snow">
        </div>
        <div>
            <label>Roll no:</label>
            <input type="number" placeholder="e.g; 202026">
        </div>
        <div>
            <label>Date of birth:</label>
            <input type="date">
        </div>
        <div>
            <label>Email:</label>
            <input type="email" placeholder="e.g; student@email.com">
        </div>
        <div>
            <label>Password:</label>
            <input type="password" placeholder="******">
        </div>
        <div>
            <label>Photo:</label>
            <input type="file" accept=".png, .jpg">
        </div>
        <div>
            <label>Class selection:</label> <br>
            <input type="radio" name="cls"> 
            <label for="">KG</label>
            
            <input type="radio" name="cls"> 
            <label for="">PG</label>
            
            <input type="radio" name="cls"> 
            <label for="">One</label>
            
            <input type="radio" name="cls"> 
            <label for="">Two</label>
        </div>
        <div>
            <button type="submit">Register</button>
            <input type="submit" value="Register"> | <input type="reset" value="Clear form">
        </div>
    </form>
</body>
</html>
