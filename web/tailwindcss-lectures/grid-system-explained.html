<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid > div {
            background-color: white;
            padding: 4px;
            box-shadow: 0px 0px 5px #333;
            border-radius: 1px;
        }
        .right {
            height: 300px;
        }
        .right div {
            padding: 3px;
            border-radius: 4px;
            box-shadow: 0px 0px 5px #333
        }
        .right .calender {
            margin: 8px 0px;
        }
    </style>
</head>
<body>

    <h2 class="m-5 p-3 font-bold shadow rounded border-l-5 border-l-sky-700">Grid in Tailwindcss</h2>

    <div class="mx-auto max-w-6xl">
        <div class="p-2 my-5 bg-green-700 grid grid-cols-12 gap-3">
            <div class="col-span-8">
                <div class="grid grid-cols-12 gap-3">
                    <div class="p-1 bg-green-200 col-span-4">1</div>
                    <div class="p-1 bg-green-200 col-span-4">2</div>
                    <div class="p-1 bg-green-200 col-span-4">3</div>
                    
                    <div class="p-1 bg-green-200 col-span-5">4</div>
                    <div class="p-1 bg-green-200 col-span-7">5</div>
                    <div class="p-1 bg-green-200 col-span-12">6</div>

                </div>
            </div>
            <div class="right col-span-4">
                <div class="activity">Activity</div>
                <div class="calender">Calender</div>
                <div class="history">History</div>
            </div>
        </div>

        <div class="p-1 bg-sky-200 grid grid-cols-12 gap-3">
            <div class="col-span-3">1</div>
            <div class="col-span-3">2</div>
            <div class="col-span-3">3</div>
            <div class="col-span-3">4</div>
        </div>
        
        <div class="p-1 bg-sky-200 my-5 grid grid-cols-12 gap-3">
            <div class="col-span-12 lg:col-span-3 md:col-span-6 sm:col-span-12">1</div>
            <div class="col-span-12 lg:col-span-3 md:col-span-6 sm:col-span-12">2</div>
            <div class="col-span-12 lg:col-span-3 md:col-span-6 sm:col-span-12">3</div>
            <div class="col-span-12 lg:col-span-3 md:col-span-6 sm:col-span-12">4</div>
        </div>
    </div>





    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</body>
</html>
