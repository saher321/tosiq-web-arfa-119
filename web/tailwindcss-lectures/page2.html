<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- fontawesome-6.7.2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body class="bg-gray-100">


    <!-- card -->
    <div class="w-fit m-5 p-3 bg-white shadow rounded-2xl">
        <!-- header -->
        <div class="relative">
            <div class="rounded-full px-3 bg-gray-200 shadow absolute top-2 left-4">
                <img class="h-10 w-12" src="./nike_logo.png" alt="">
            </div>
            <img class="rounded-xl w-full h-56" src="./red-bg-nike-shoes.avif" alt="">
        </div>

        <!-- body -->
        <div class="my-4">
            <div class="flex justify-between">
                <div class="py-2 px-3 font-bold text-red-800 rounded-full bg-red-100 text-[11px]">Best seller</div>
                <div class="text-red-800">
                    <i class="fa-solid fa-heart"></i>
                </div>
            </div>
            <h1 class="mt-1 text-sm font-bold">Dusk high "Red Satin" sneakers </h1>
        </div>

        <!-- footer -->
        <div>
            <div class="flex gap-8 items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-[11px] text-gray-500">Price</span>
                    <span class="text-lg text-red-800 font-bold">$180.00</span>
                </div>
                <div class="grow">
                    <button class="w-full text-white bg-[#2C2C2C] rounded-full py-2 px-6">Buy now</button>
                </div>
            </div>
        </div>
    </div>
    <!-- card end -->





    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</body>
</html>
